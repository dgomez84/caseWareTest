spring:
  application:
    name: caseware-template-fanout-worker
  threads:
    virtual:
      enabled: true

caseware:
  fanout:
    max-concurrency: 20
    simulation:
      enabled: true
    retry:
      max-attempts: 3
      initial-delay: 2s
      max-delay: 30s
      multiplier: 2.0
      jitter-enabled: true
